<header class="tg-pad-y(xl)">
  <div class="tg-center tg-width(full) tg-max-width(wide) tg-pad-x(md) tg-row tg-justify(between) tg-align(center)">
    <a href="{{ site.baseurl }}/">
      <svg class="tg-icon(ink) tg-width(icon-md) tg-height(icon-md)" viewBox="0 0 31.75 28.575" role="img" aria-label="Tidgrid" xmlns="http://www.w3.org/2000/svg"><use href="{{ site.baseurl }}/assets/img/logo.svg#layer1" /></svg>
    </a>

    <div class="tg-row tg-align(center) tg-gap(md) sm:tg-gap(xl)">
    <button id="toggle-header-navigation" class="tg-action(icon) sm:tg-hide" aria-label="Open the menu">
      <svg class="tg-icon(ink) tg-width(icon-md) tg-height(icon-md)"clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m11 16.745c0-.414.336-.75.75-.75h9.5c.414 0 .75.336.75.75s-.336.75-.75.75h-9.5c-.414 0-.75-.336-.75-.75zm-9-5c0-.414.336-.75.75-.75h18.5c.414 0 .75.336.75.75s-.336.75-.75.75h-18.5c-.414 0-.75-.336-.75-.75zm4-5c0-.414.336-.75.75-.75h14.5c.414 0 .75.336.75.75s-.336.75-.75.75h-14.5c-.414 0-.75-.336-.75-.75z" fill-rule="nonzero"/></svg>
    </button>
      
    <nav id="header-navigation" class="tg-layout(drawer) tg-surface(drawer) tg-pad(xl) sm:tg-pad(none)">
      <button id="close-sidebar" class="tg-action(icon) tg-layout(corner) sm:tg-hide">
        <svg class="tg-icon(ink) tg-width(icon-sm) tg-height(icon-sm)"clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="m12 10.93 5.719-5.72c.146-.146.339-.219.531-.219.404 0 .75.324.75.749 0 .193-.073.385-.219.532l-5.72 5.719 5.719 5.719c.147.147.22.339.22.531 0 .427-.349.75-.75.75-.192 0-.385-.073-.531-.219l-5.719-5.719-5.719 5.719c-.146.146-.339.219-.531.219-.401 0-.75-.323-.75-.75 0-.192.073-.384.22-.531l5.719-5.719-5.72-5.719c-.146-.147-.219-.339-.219-.532 0-.425.346-.749.75-.749.192 0 .385.073.531.219z"/></svg>
      </button>
      <ul class="tg-list(plain) tg-col sm:tg-row tg-y-gap(xl) sm:tg-x-gap(xl)">
        {% include navigation-link.html
          name="Get started"
          href="/get-started" %}

        {% include navigation-link.html
          name="Documentation"
          href="/docs" %}
      </ul>
    </nav>
    <button id="toggle-theme" class="tg-action(icon) tg-order(first) sm:tg-order(last)" aria-label="Switch between light and dark">
      <svg class="tg-icon(ink) tg-width(icon-sm) tg-height(icon-sm)" viewBox="0 0 24 24" fill-rule="evenodd" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20zm0 2v16a8 8 0 0 1 0-16z" /></svg>
    </button>
    </div>
  </div>
</header>
