<section class="tg-pad-y(xxl)">
  <div class="tg-center tg-width(full) tg-max-width(measure) tg-pad-x(md) tg-col tg-y-gap(xl)">
    <h2 class="tg-text(section-title) tg-text-align(center)">
      {{ include.title }}
    </h2>

    <div class="tg-col lg:tg-row tg-align(center) tg-gap(xl)">
      <div class="tg-grow">
        {{ include.source }}
      </div>

      <div class="tg-grow">
        {{ include.result }}
      </div>
    </div>
  </div>
</section>
