---
layout: default
---

<section class="tg-pad-y(xl)">
  <div class="tg-center tg-width(full) tg-max-width(measure) tg-pad-x(md) tg-col tg-y-gap(lg)">
    <nav class="tg-row tg-wrap">
      {% assign parts = page.dir | split: "/" %}
      {% assign length = parts.size | minus: 1 %}

      {% for i in (1..length) %}
        <a class="tg-link(breadcrumb)" href="{{ site.baseurl }}/{{ parts | slice: 1, i | join: "/" }}">{{ parts[i] | capitalize }}</a>
      {% endfor %}

      <span class="tg-link(breadcrumb) tg-state(current)">{{ page.title }}</span>
    </nav>

    <h1 class="tg-text(page-title)">{{ page.title }}</h1>

    <div class="tg-text(prose)">
      {{ content }}
    </div>
  </div>
</section>
