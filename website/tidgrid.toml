[project]
prefix = "tg"
out    = "assets/css/tidgrid.css"
scan   = [".", "../docs"]   # website/docs is a symlink; check does not follow those

[breakpoints]
xs = "36em"
sm = "48em"
md = "64em"
lg = "75em"
xl = "90em"

# ---------------------------------------------------------------- tokens

# Every colour is a pair: light-dark(light, dark). The browser picks by the
# reader's system setting, switched on by color-scheme on html below.
[tokens.color]
ink         = "light-dark(#32495d, #d7e2ec)"
ink-soft    = "light-dark(#4d708e, #a3bcd1)"
muted       = "light-dark(#92adc4, #7b96ac)"
paper       = "light-dark(#ffffff, #11171d)"
raised      = "light-dark(#ffffff, #171f27)"
tint        = "light-dark(#f7f7f7, #18212a)"
drawer      = "light-dark(#f8f8f8, #151c24)"
drawer-edge = "light-dark(#ececec, #27323d)"
edge        = "light-dark(#f0f0f0, #232d38)"
sand        = "light-dark(#f8f3ed, #222e3a)"
sand-ink    = "light-dark(#c3a888, #d2b892)"
accent      = "light-dark(#da526b, #ec6b82)"
pass        = "light-dark(#1d7a62, #6fd0b0)"   # in the vocabulary: built, allowed, passes (accent is its opposite)
keyword     = "light-dark(#fa8383, #ff9b9b)"
shade       = "light-dark(#00000011, #00000055)"
shade-deep  = "light-dark(#00000021, #00000088)"
code-ground = "light-dark(#fafafa, #0c1116)"
code-edge   = "light-dark(#f2f2f2, #1e2832)"
# Syntax colours come from the page's own hues (slate blue, the pink accent),
# not from an editor theme: sections in the accent, keys blue, strings mint.
code-ink    = "light-dark(#32495d, #c5d2de)"
syn-comment = "light-dark(#5f7488, #6f879b)"
syn-keyword = "light-dark(#6a4fc0, #b7a6f2)"
syn-tag     = "light-dark(#c2334f, #ec6b82)"
syn-literal = "light-dark(#b3366f, #f2a0b1)"
syn-string  = "light-dark(#23755f, #a9d6c4)"
syn-attr    = "light-dark(#2a6aa0, #8fb8de)"
syn-title   = "light-dark(#1f5fa8, #7fb6f0)"
syn-builtin = "light-dark(#0f7385, #7fd1de)"

[tokens.space]
none = "0"
xs   = "0.5rem"
sm   = "1rem"
md   = "1.5rem"
lg   = "2rem"
xl   = "3rem"
xxl  = "5rem"

[tokens.size]
full    = "100%"
measure = "72rem"
wide    = "84rem"
drawer  = "20rem"
specimen = "19rem"
icon-sm = "2rem"
icon-md = "3rem"
cell    = "5rem"
hero    = "calc(100svh - 7rem)"   # the first screen under the header (its 3rem logo + twice space.lg)
reading = "44rem"                 # a line of running text
aside   = "20rem"                 # the heading column beside a section
rail    = "13rem"                 # the list of pages beside a docs page
pin     = "16vh"                  # how far from the top a scene's question stays pinned
screen  = "100vh"

[tokens.font]
sans  = "Lato, sans-serif"
title = "Montserrat, Lato, sans-serif"
mono  = "\"Source Code Pro\", monospace"

[tokens.type]
small     = "0.9rem"
label     = "0.95rem"
base      = "1rem"
heading   = "1.1rem"
crumb     = "1.15rem"
lead      = "1.2rem"
subtitle  = "1.5rem"
h2        = "2rem"
h1        = "2.5rem"
display   = "3rem"
hero-narrow = "2.75rem"
hero      = "4rem"
hero-wide = "5rem"
hero-max  = "7rem"
cell      = "0.7rem"

[tokens.border]
hair  = "1px"
focus = "2px"
bar   = "3px"

[tokens.radius]
sm = "0.25rem"
md = "0.5rem"

[tokens.shadow]
card       = "0 0 1rem 0 {color.shade}"
card-hover = "0 0 1rem 0 {color.shade-deep}"

[tokens.motion]
fast   = "200ms"
medium = "300ms"
slow   = "500ms"
drift  = "70s"      # one full loop of a drifting row of tags
cell   = "3600ms"   # how long one lit grid cell lives

# ---------------------------------------------------------------- elements

[element."*"]
box-sizing = "border-box"
margin     = "0"
padding    = "0"

[element.html]
color-scheme = "light dark"

[element.html."&.tg-state(light)"]
color-scheme = "light"

[element.html."&.tg-state(dark)"]
color-scheme = "dark"

[element.body]
min-height       = "{size.screen}"
overflow-x       = "hidden"
display          = "flex"
flex-direction   = "column"
font-family      = "{font.sans}"
color            = "{color.ink}"
background-color = "{color.paper}"

[element.img]
display = "block"

[element.svg]
display = "block"

# ---------------------------------------------------------------- text

[role.text.page-title]
use         = "The one title of a page (h1 or the first line). Never twice on a page."
font-family = "{font.title}"
font-size   = "{type.h2}"
font-weight = "700"
color       = "{color.ink}"

[role.text.page-title."@sm"]
font-size = "{type.h1}"

[role.text.page-title."@md"]
font-size = "{type.display}"

[role.text.section-title]
use         = "Heading of a section inside a page. Lighter than the page title."
font-family = "{font.title}"
font-size   = "{type.h2}"
font-weight = "400"
color       = "{color.ink}"

[role.text.body]
use         = "Ordinary running text. The default for any paragraph."
line-height = "1.75"
color       = "{color.ink}"

[role.text.tagline]
use         = "The one big statement under the hero wordmark on the front page."
text-wrap   = "balance"
font-family = "{font.title}"
font-size   = "{type.subtitle}"
font-weight = "400"
color       = "{color.ink}"

[role.text.tagline."@lg"]
font-size = "{type.display}"

[role.text.punch]
use         = "The big statement that heads a scene of the front page: one or two short sentences. Not the heading of a docs section."
font-family = "{font.title}"
font-size   = "{type.h1}"
font-weight = "700"
line-height = "1.1"
text-wrap   = "balance"
color       = "{color.ink}"

[role.text.punch."@lg"]
font-size = "{type.hero}"

[role.text.lead]
use         = "The sentence or two under a text(punch), a tagline or a page title: larger than body, quieter than the statement above it."
font-size   = "{type.lead}"
line-height = "1.6"
text-wrap   = "pretty"
color       = "{color.ink-soft}"

[role.text.lead."@lg"]
font-size = "{type.subtitle}"

[role.text.entry-title]
use         = "The name of one entry in a list of pages, inside link(entry). Takes the link's colour, so it lights up with it."
font-family = "{font.title}"
font-size   = "{type.lead}"
font-weight = "600"

[role.text.fine-print]
use         = "Small muted text such as licence lines in the footer."
font-size   = "{type.small}"
line-height = "1.75"
color       = "{color.muted}"

[role.text.wordmark]
use            = "The product name set in monospace, lowercase. Footer size; one per area."
font-family    = "{font.mono}"
font-size      = "{type.h2}"
text-transform = "lowercase"
color          = "{color.ink}"
user-select    = "none"

[role.text.wordmark-hero]
use         = "The huge product name of the front page hero. Pair with text(wordmark-accent) for the accent part."
font-family = "{font.mono}"
font-size   = "{type.hero-narrow}"
line-height = "1.2"
color       = "{color.ink}"
user-select = "none"

[role.text.wordmark-hero."@xs"]
font-size = "{type.hero}"

[role.text.wordmark-hero."@sm"]
font-size = "{type.hero-wide}"

[role.text.wordmark-hero."@lg"]
font-size = "{type.hero-max}"

[role.text.wordmark-accent]
use   = "Accent colour for a part of a wordmark (the .dev)."
color = "{color.accent}"

[role.text.version]
use         = "A version number next to the wordmark."
font-family = "{font.mono}"
font-size   = "{type.base}"
color       = "{color.muted}"

[role.text.keyword]
use           = "A short inline term, class name or command inside a sentence (shown as a chip)."
display       = "inline-block"
max-width     = "{size.full}"
overflow-wrap = "anywhere"
padding       = "0 {space.xs}"
font-family   = "{font.mono}"
color         = "{color.keyword}"
background    = "{color.sand}"
border-radius = "{radius.sm}"

[role.text.error-code]
use         = "The huge number on an error page."
font-family = "{font.title}"
font-size   = "{type.hero}"
font-weight = "900"
text-align  = "center"
color       = "{color.ink}"

[role.text.error-message]
use         = "The sentence under an error code."
font-size   = "{type.subtitle}"
text-align  = "center"
color       = "{color.ink}"

[role.text.prose]
use         = "Wrap rendered Markdown (a docs page body). Styles its p, h2, ul, ol, a and code so the Markdown source needs no classes."
font-family   = "{font.sans}"
overflow-wrap = "anywhere"

[role.text.prose."& > * + *"]
margin-top = "{space.lg}"

[role.text.prose."& h3"]
font-family = "{font.title}"
font-size   = "{type.heading}"
font-weight = "700"

[role.text.prose."& h4"]
font-family    = "{font.title}"
font-size      = "{type.label}"
font-weight    = "600"
text-transform = "uppercase"

[role.text.prose."& table"]
display         = "block"
max-width       = "{size.full}"
overflow-x      = "auto"
overflow-wrap   = "normal"
border-collapse = "collapse"
font-size       = "{type.small}"
line-height     = "1.5"

[role.text.prose."& th"]
padding        = "{space.xs} {space.sm}"
font-family    = "{font.title}"
font-weight    = "600"
text-align     = "start"
vertical-align = "top"
background     = "{color.tint}"
border         = "{border.hair} solid {color.edge}"

[role.text.prose."& td"]
padding        = "{space.xs} {space.sm}"
vertical-align = "top"
border         = "{border.hair} solid {color.edge}"

[role.text.prose."& p"]
line-height = "1.75"

[role.text.prose."& h2"]
font-family = "{font.title}"
font-size   = "{type.h2}"
font-weight = "400"

[role.text.prose."& ul"]
margin-left = "{space.lg}"

[role.text.prose."& ol"]
margin-left = "{space.lg}"

[role.text.prose."& li + li"]
margin-top = "{space.sm}"

[role.text.prose."& a"]
font-weight     = "600"
text-decoration = "none"
color           = "{color.ink}"
transition      = "color {motion.fast}"

[role.text.prose."& a:hover"]
color = "{color.ink-soft}"

[role.text.prose."& :not(pre) > code"]
padding       = "0 {space.xs}"
font-family   = "{font.mono}"
color         = "{color.keyword}"
background    = "{color.sand}"
border-radius = "{radius.sm}"

# ---------------------------------------------------------------- links and navigation

[role.link.nav]
use             = "A link in the main header navigation. Mark the page you are on with state(current)."
font-family     = "{font.title}"
font-size       = "{type.label}"
font-weight     = "600"
text-transform  = "uppercase"
text-decoration = "none"
color           = "{color.ink}"
transition      = "color {motion.fast}"

[role.link.nav."&:hover"]
color = "{color.ink-soft}"

[role.link.nav."&.tg-state(current)"]
color         = "{color.accent}"

[role.link.text]
use             = "A plain text link outside prose, such as the 'more' link under a block of text. Not for the header or the footer."
font-weight     = "600"
text-decoration = "underline"
color           = "{color.ink}"
transition      = "color {motion.fast}"

[role.link.text."&:hover"]
color = "{color.ink-soft}"

[role.link.entry]
use             = "One row of a list of pages: the whole row is the link, with a rule above it. Holds a sample on one side and text(entry-title) with a line of text(body) on the other."
display         = "block"
border-top      = "{border.hair} solid {color.drawer-edge}"
text-decoration = "none"
color           = "{color.ink}"
transition      = "color {motion.fast}"

[role.link.entry."&:is(:hover, :focus-visible)"]
color = "{color.accent}"

[role.link.page]
use            = "A plain link in a list of pages: the documentation pages in the footer or beside a docs page. Mark the page being shown with state(current)."
font-family     = "{font.sans}"
text-decoration = "none"
color           = "{color.ink}"
transition      = "color {motion.fast}"

[role.link.page."&:hover"]
color = "{color.ink-soft}"

[role.link.page."&.tg-state(current)"]
color       = "{color.accent}"
font-weight = "700"

[role.link.footer-heading]
use             = "A main link in the footer (Home, Get started, a section name) or a licence name; uppercase."
font-family     = "{font.title}"
font-size       = "{type.small}"
font-weight     = "600"
text-transform  = "uppercase"
text-decoration = "none"
color           = "{color.ink}"
transition      = "color {motion.fast}"

[role.link.footer-heading."&:hover"]
color = "{color.ink-soft}"

[role.link.breadcrumb]
use             = "One step of a breadcrumb trail, a link to a parent page. The last step is the page itself: add state(current). The arrow between steps is drawn by the role."
font-size       = "{type.crumb}"
text-decoration = "none"
color           = "{color.ink}"
transition      = "color {motion.fast}"

[role.link.breadcrumb."&:hover"]
color = "{color.ink-soft}"

[role.link.breadcrumb."&:not(:last-child)::after"]
content = "\"›\""
margin  = "0 {space.xs}"

[role.link.breadcrumb."&.tg-state(current)"]
font-weight = "900"

[role.link.card]
use             = "The link that makes a whole card clickable. Wraps a surface(card)."
text-decoration = "none"
color           = "{color.ink}"

[role.state.current]
use = "Set on the link of the page being shown: in the header navigation, a breadcrumb or a list of pages."

[role.state.open]
use = "Set by a script on an element that is currently open, for example the header menu panel on small screens."

[role.state.light]
use = "Set by a script on html when the reader picked the light colours with the header button. Without it and state(dark) the page follows the system."

[role.state.dark]
use = "Set by a script on html when the reader picked the dark colours with the header button."

[role.state.foreign]
use = "Set by the backdrop script on a surface(cell) that shows a class name from outside the vocabulary: accent colour, struck out."

[role.state.scripted]
use = "Set on html by story.js once it runs. Without it a story reads as a plain page: every piece is visible from the start."

[role.state.shown]
use = "Set by story.js on a motion(rise) block once it has scrolled into view."

[role.list.plain]
use        = "A list without bullets or indent, for navigation links."
list-style = "none"

[role.icon.ink]
use  = "Colours an inline svg icon with the text colour."
fill = "{color.ink}"

# ---------------------------------------------------------------- actions

[role.action.primary]
use             = "The one main button of a view: dark, filled. Put it first."
display         = "block"
padding         = "{space.sm}"
border-radius   = "{radius.sm}"
font-family     = "{font.title}"
font-weight     = "700"
text-align      = "center"
text-decoration = "none"
color           = "{color.paper}"
background      = "{color.ink}"

[role.action.secondary]
use             = "A second button beside the primary one: quiet, sand coloured."
display         = "block"
padding         = "{space.sm}"
border-radius   = "{radius.sm}"
font-family     = "{font.title}"
font-weight     = "700"
text-align      = "center"
text-decoration = "none"
color           = "{color.ink}"
background      = "{color.sand}"

[role.action.icon]
use         = "A bare button that holds only an icon (open or close the menu)."
padding     = "0"
appearance  = "none"
border      = "none"
outline     = "none"
background  = "transparent"
cursor      = "pointer"

[role.action.icon."&:focus-visible"]
outline        = "{border.focus} solid {color.accent}"
outline-offset = "{border.focus}"
border-radius  = "{radius.sm}"

# ---------------------------------------------------------------- surfaces

[role.surface.footer]
use        = "The page footer band. Once per page."
background = "{color.tint}"

[role.surface.drawer]
use        = "Look of the header menu panel: tinted slide-in panel on small screens, no look at all from sm up. Goes with layout(drawer)."
background = "{color.drawer}"
border-left = "{border.hair} solid {color.drawer-edge}"

[role.surface.drawer."@sm"]
background  = "transparent"
border-left = "none"

[role.surface.card]
use           = "A clickable panel for one entry of a list of pages (title and a line of text). Put inside link(card)."
padding       = "{space.md}"
border        = "{border.hair} solid {color.edge}"
border-radius = "{radius.md}"
background    = "{color.raised}"
box-shadow    = "{shadow.card}"
transition    = "box-shadow {motion.medium}"

[role.surface.card."&:hover"]
box-shadow = "{shadow.card-hover}"

[role.surface.note]
use           = "A callout that sets a remark apart from the text: a heading line (text(note-title)) and a body. Use for notices such as 'under development'."
border        = "{border.hair} solid {color.edge}"
border-radius = "{radius.md}"
background    = "{color.tint}"
color         = "{color.ink}"

[role.text.note-title]
use           = "The heading line of a surface(note)."
font-family   = "{font.title}"
font-size     = "{type.label}"
font-weight   = "600"
text-transform = "uppercase"
border-bottom = "{border.hair} solid {color.edge}"

[role.surface.code]
use           = "A panel for a code sample or shell command: on a pre, or on a div that holds several pre blocks or text(line) rows built up one by one. Colours highlight.js syntax inside it. With data-alarm it is the panel where something outside the vocabulary ended up."
overflow      = "auto"
padding       = "{space.md}"
font-family   = "{font.mono}"
line-height   = "1.75"
color         = "{color.code-ink}"
background    = "{color.code-ground}"
border        = "{border.hair} solid {color.code-edge}"
border-radius = "{radius.md}"

[role.surface.code."&[data-alarm]"]
border-color = "{color.accent}"
box-shadow   = "0 0 {space.lg} 0 color-mix(in srgb, {color.accent} 22%, transparent)"

[role.surface.code."& code"]
font-family = "{font.mono}"
color       = "inherit"
background  = "transparent"
padding     = "0"

[role.surface.code."& .hljs-comment"]
color      = "{color.syn-comment}"
font-style = "italic"

[role.surface.code."& .hljs-keyword"]
color       = "{color.syn-keyword}"
font-weight = "700"

[role.surface.code."& .hljs-section"]
color       = "{color.syn-tag}"
font-weight = "700"

[role.surface.code."& .hljs-name"]
color = "{color.syn-tag}"

[role.surface.code."& .hljs-selector-tag"]
color = "{color.syn-tag}"

[role.surface.code."& .hljs-literal"]
color = "{color.syn-literal}"

[role.surface.code."& .hljs-string"]
color = "{color.syn-string}"

[role.surface.code."& .hljs-attribute"]
color = "{color.syn-string}"

[role.surface.code."& .hljs-attr"]
color = "{color.syn-attr}"

[role.surface.code."& .hljs-number"]
color = "{color.syn-attr}"

[role.surface.code."& .hljs-title"]
color = "{color.syn-title}"

[role.surface.code."& .hljs-built_in"]
color = "{color.syn-builtin}"

# ---------------------------------------------------------------- the front page story
# Scenes read by scrolling, each headed by the question it answers and each with a picture
# of its own that builds up piece by piece (story.js). Two colours carry a meaning in the
# pictures: pass = in the vocabulary, accent = outside it.

[role.surface.progress]
use              = "The thin bar on the top edge that shows how far a story has been read. Once per page; story.js scales it."
position         = "fixed"
top              = "0"
left             = "0"
z-index          = "2"
width            = "{size.full}"
height           = "{border.bar}"
background       = "{color.pass}"
transform        = "scaleX(0)"
transform-origin = "left"

[role.layout.pinned]
use = "Keeps the shorter side of a two-column block in view from lg while the taller side scrolls past: a scene's question beside its picture, the list of pages beside a docs page. One per block."

[role.layout.pinned."@lg"]
position = "sticky"
top      = "{size.pin}"

[role.text.caption]
use         = "A small label above a panel: who or what the panel is (Agent, tidgrid.toml, a command, Not like this). On a div when inside text(prose)."
font-family = "{font.mono}"
font-size   = "{type.small}"
color       = "{color.ink-soft}"

[role.text.line]
use           = "One row of a terminal or code panel that is built up row by row, inside surface(code) on a div. Keeps its spaces; a row too long for the panel wraps, as in a terminal."
display       = "block"
white-space   = "pre-wrap"
overflow-wrap = "anywhere"

[role.text.refused]
use        = "Marks a piece of code or a status word as outside the vocabulary: what check refuses, or would have."
color      = "{color.accent}"
background = "color-mix(in srgb, {color.accent} 16%, transparent)"

[role.text.passed]
use   = "Marks a status word as fine: merged, built, in the vocabulary."
color = "{color.pass}"

[role.surface.tag]
use           = "One item of a surface(stream): a short name with its status word. With data-alarm it is the one item to notice."
white-space   = "nowrap"
padding       = "{space.xs} {space.sm}"
border        = "{border.hair} solid {color.drawer-edge}"
border-radius = "{radius.md}"
background    = "{color.raised}"
font-family   = "{font.mono}"
font-size     = "{type.small}"
color         = "{color.ink-soft}"

[role.surface.tag."&[data-alarm]"]
border-color = "{color.accent}"
color        = "{color.ink}"

[role.surface.stream]
use        = "A band of rows of surface(tag) that drift sideways and fade out at both ends: the flow of work between two panels. Decoration; hide it from assistive technology."
overflow   = "hidden"
mask-image = "linear-gradient(to right, transparent, {color.ink} 14%, {color.ink} 86%, transparent)"

[keyframes.drift."0%"]
transform = "translateX(0)"

[keyframes.drift."100%"]
transform = "translateX(-50%)"

[role.motion.drift]
use       = "A row inside surface(stream) that drifts left without end. Write its items twice, each with its own trailing space, so the loop has no seam."
width     = "max-content"
animation = "{keyframes.drift} {motion.drift} linear infinite"

[role.motion.drift."@media (prefers-reduced-motion: reduce)"]
animation = "none"

[role.motion.drift-back]
use       = "Like motion(drift), the other way: for every second row of a stream."
width     = "max-content"
animation = "{keyframes.drift} {motion.drift} linear infinite reverse"

[role.motion.drift-back."@media (prefers-reduced-motion: reduce)"]
animation = "none"

[role.motion.rise]
use = "A piece of a scene that fades and rises in once, when it scrolls into view (story.js sets state(shown); with reduced motion asked for, on every piece at once)."

[role.motion.rise.".tg-state(scripted) &"]
opacity    = "0"
transform  = "translateY({space.sm})"
transition = "opacity {motion.slow}, transform {motion.slow}"

[role.motion.rise.".tg-state(scripted) &.tg-state(shown)"]
opacity   = "1"
transform = "none"

# ---------------------------------------------------------------- the backdrop

[keyframes.cell."0%"]
opacity = "0"

[keyframes.cell."12%"]
opacity = "1"

[keyframes.cell."75%"]
opacity = "1"

[keyframes.cell."100%"]
opacity = "0"

[role.surface.grid]
use              = "The grid of fine lines behind every page: one fixed layer, first in body, hidden from assistive technology. The backdrop script moves it slower than the page."
position         = "fixed"
top              = "0"
right            = "0"
bottom           = "calc({size.cell} * -1)"
left             = "0"
z-index          = "-1"
pointer-events   = "none"
background-size  = "{size.cell} {size.cell}"
background-image = "linear-gradient(to right, {color.tint} {border.hair}, transparent {border.hair}), linear-gradient(to bottom, {color.tint} {border.hair}, transparent {border.hair})"

[role.surface.cell]
use         = "One lit cell of the page grid, holding a class name. Created and placed by the backdrop script inside surface(grid); never written in a page."
position    = "absolute"
display     = "grid"
place-items = "center"
width       = "{size.cell}"
height      = "{size.cell}"
font-family = "{font.mono}"
font-size   = "{type.cell}"
color       = "{color.ink-soft}"
background  = "color-mix(in srgb, {color.ink-soft} 9%, transparent)"
animation   = "{keyframes.cell} {motion.cell} ease-in-out both"

[role.surface.cell."&.tg-state(foreign)"]
color           = "{color.accent}"
background      = "color-mix(in srgb, {color.accent} 12%, transparent)"
text-decoration = "line-through"

# ---------------------------------------------------------------- layout the atoms cannot express

[role.layout.drawer]
use       = "The header navigation container. On small screens a panel fixed to the right edge, hidden until a script sets state(open); from sm up an ordinary inline block. Goes with surface(drawer)."
display   = "none"
position  = "fixed"
top       = "0"
right     = "0"
z-index   = "3"
width     = "{size.full}"
max-width = "{size.drawer}"
height    = "{size.full}"

[role.layout.drawer."&.tg-state(open)"]
display = "block"

[role.layout.drawer."@sm"]
display   = "block"
position  = "static"
width     = "auto"
max-width = "none"
height    = "auto"

[role.layout.corner]
use      = "Pins an element to the top-right corner of the screen (a close button on the drawer)."
position = "absolute"
top      = "{space.lg}"
right    = "{space.lg}"

[role.layout.footer]
use     = "The footer's three blocks, in this order: brand, navigation, legal. Stacked on small screens. From md up the navigation takes the left side, brand sits top right and legal bottom right."
display = "grid"

[role.layout.footer."@md"]
grid-template-columns = "1fr auto"
grid-template-rows    = "auto 1fr"

[role.layout.footer."@md"."& > :nth-child(1)"]
grid-area = "1 / 2"

[role.layout.footer."@md"."& > :nth-child(2)"]
grid-area = "1 / 1 / 3 / 2"

[role.layout.footer."@md"."& > :nth-child(3)"]
grid-area  = "2 / 2"
align-self = "end"

# ---------------------------------------------------------------- exceptions

[allow.class]
nohighlight = "read by highlight.js: keeps a panel of plain text, a shell command or tool output uncoloured"
