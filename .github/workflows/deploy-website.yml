name: Check, build and deploy website to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Built from a pinned commit: the tool has no release tag yet, and
      # `go install` trips over the repo's old tags, which have no go.mod.
      - name: Install tidgrid
        run: |
          git clone --quiet https://github.com/sneikki/tidgrid "$RUNNER_TEMP/tidgrid-src"
          cd "$RUNNER_TEMP/tidgrid-src"
          git checkout --quiet dd43573b022056e4a5aef53d459f348b36938774
          go build -o "$RUNNER_TEMP/bin/tidgrid" .
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check pages against the vocabulary
        run: cd website && tidgrid check

      - name: Create Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: website

      - name: Build website
        run: cd website && bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
