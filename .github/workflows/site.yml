name: Check, build and deploy website to GitHub Pages

# The live site is the branch `site`. It follows master: every push to master
# moves it forward. A hotfix is merged into `site` first, which deploys it, and
# then `site` is merged into master.
on:
  push:
    branches:
      - master
      - site
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # The site is checked with the tool from this same commit.
      - name: Build tidgrid
        run: |
          go build -o "$RUNNER_TEMP/bin/tidgrid" ./cmd/tidgrid
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check pages against the vocabulary
        run: cd website && tidgrid check

      - name: Create Ruby environment
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: website

      - name: Build website
        run: cd website && bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload build artifact
        if: github.ref == 'refs/heads/site' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  # Master moved: move `site` to it and start the deploy from `site`.
  advance:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      actions: write

    # One at a time, so two close pushes to master cannot cross.
    concurrency:
      group: site-advance
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Moves `site` to master's newest commit, not this run's: a run that
      # starts late then does nothing wrong.
      - name: Fast-forward site to master
        run: |
          git fetch origin master site
          if ! git merge-base --is-ancestor origin/site origin/master; then
            echo "::error::site has commits master lacks (a hotfix): merge site into master with a merge commit first"
            exit 1
          fi
          if ! git push origin origin/master:refs/heads/site; then
            echo "::error::the push to site was refused. This run's token may not move a branch across a change to .github/workflows: run 'git push origin master:site' yourself"
            exit 1
          fi

      # A push made with the workflow's own token starts no run, so start it.
      - name: Start the deploy
        run: gh workflow run site.yml --ref site
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.ref == 'refs/heads/site' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    # An older build never lands after a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
